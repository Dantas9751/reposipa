<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIPA - Mapa Geoespacial</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=accessibility_new">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

  <nav class="menu">
    <a href="../index.html" class="logo">
      <i class="fa-solid fa-leaf"></i>
      SIPA
    </a>

    <ul class="links-menu">
      <li><a href="../index.html">Início</a></li>
      <li><a href="leis.html">Leis</a></li>
      <li><a href="mapa.html" class="ativo">Mapa</a></li>
      <li><a href="faq.html">FAQ</a></li>
      <li><a href="contato.html">Contato</a></li>
    </ul>

    <button class="acessibilidade" title="Acessibilidade">
      <span class="material-symbols-outlined">accessibility_new</span>
    </button>
  </nav>

  <main class="conteudo">

    <section class="secao-padrao secao-mapa">

      <h1 class="titulo-mapa" id="titulo-mapa">
      <i class="fa-solid fa-map"></i>
        Mapa Geoespacial
      </h1>

      <div class="controles">

        <form class="busca" role="search">
          <input
            type="search"
            id="campo-busca"
            class="campo-busca"
            placeholder="Digite um endereço ou coordenada. Ex.: -22.52, -44.10"
          >

          <button class="btn-dark" type="submit">
            Buscar
          </button>
        </form>

        <button class="botao-historico" type="button">
          Acessar Histórico
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>

      </div>

<figure class="area-mapa">

  <div id="mapa" class="imagem-mapa"></div>

  <aside class="legenda">

    <h2 class="titulo-legenda">
      <i class="fa-solid fa-layer-group"></i>
      Camadas
    </h2>

    <ul>
      <li class="item-legenda">
        <span class="ponto amarelo" data-tooltip="Unidade de Conservação é uma área protegida criada para preservar a biodiversidade, os recursos naturais e os ecossistemas, podendo permitir uso sustentável ou proteção integral da natureza."></span>
        Unidade de Conservação
      </li>

      <li class="item-legenda">
        <span class="ponto verde" data-tooltip="Área de Preservação Permanente (APP) é uma área protegida por lei, geralmente localizada próxima a rios, nascentes, encostas e matas, com o objetivo de preservar a natureza, evitar erosões, proteger os recursos hídricos e manter o equilíbrio ambiental."></span>
        Área de Preservação Permanente
      </li>

      <li class="item-legenda">
        <span class="ponto azul" data-tooltip="Bacias Hidrográficas são áreas de drenagem onde toda a água da chuva escoa para um mesmo rio principal, incluindo seus afluentes, nascentes e cursos d’água."></span>
        Bacias Hidrográficas
      </li>
    </ul>

  </aside>

</figure>

    </section>

  </main>

  <footer class="rodape">
    <p>© 2026 SIPA - Sistema Integrado de Planejamento Ambiental. Todos os direitos reservados.</p>
  </footer>

  <script src="../js/mapa.js"></script>

  <script src="../js/acessibilidade.js"></script>

</body>
</html>
